name: Database backup

# Daily encrypted backup of the Merchant OS database (Supabase, PostgreSQL 17).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Project Settings → Database → Connection string
#                       (Session pooler, URI form, with the database password filled in)
#   BACKUP_PASSPHRASE   a long passphrase you keep somewhere safe; without it the
#                       backup cannot be opened
# Until both exist the job only prints a notice. Restore steps: merchant-os/docs/BACKUPS.md.

on:
  schedule:
    - cron: "17 2 * * *" # every day at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::Backup skipped: add SUPABASE_DB_URL and BACKUP_PASSPHRASE as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%d)
          # Application data (public, app) and accounts (auth). Custom format: restore with pg_restore.
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=app --schema=auth --file=db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "merchant-os-$stamp.dump.gpg" db.dump
          shred -u db.dump
          ls -l "merchant-os-$stamp.dump.gpg"
          echo "BACKUP_FILE=merchant-os-$stamp.dump.gpg" >> "$GITHUB_ENV"

      - name: Keep the encrypted file for 30 days
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
