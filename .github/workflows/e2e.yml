name: E2E

# End-to-end browser tests (merchant-os/docs/QA_PLAN.md): a production build of
# Merchant OS against a throwaway local Supabase stack. Never uses the hosted
# project or real Sendit. Pull requests only, and only when merchant-os changed,
# to keep Actions minutes low.
on:
  pull_request:
    paths:
      - "merchant-os/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: merchant-os
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: merchant-os/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase (migrations applied)
        run: |
          supabase --version
          supabase start || { echo "retrying start"; supabase stop --no-backup || true; supabase start; }

      - name: Export local stack settings
        run: |
          supabase status -o env > /tmp/stack.env
          # Names differ between CLI versions; take whichever is present.
          get() { grep -E "^$1=" /tmp/stack.env | head -1 | cut -d= -f2- | tr -d '"'; }
          url=$(get API_URL)
          anon=$(get ANON_KEY); [ -n "$anon" ] || anon=$(get PUBLISHABLE_KEY)
          service=$(get SERVICE_ROLE_KEY); [ -n "$service" ] || service=$(get SECRET_KEY)
          if [ -z "$url" ] || [ -z "$anon" ] || [ -z "$service" ]; then
            echo "::error::Could not read the local stack settings"; cut -d= -f1 /tmp/stack.env; exit 1
          fi
          echo "::add-mask::$service"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Show what the failing pages displayed
        if: failure()
        run: find test-results -name error-context.md -print -exec cat {} \; 2>/dev/null | head -400 || true

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            merchant-os/playwright-report
            merchant-os/test-results
          retention-days: 7
