# Local Supabase stack for the end-to-end tests only (docs/QA_PLAN.md).
# The Supabase CLI reads this file; it does not change the hosted project,
# which keeps sign-up disabled.
project_id = "merchant-os-e2e"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
